# Deliberately bookworm: libraspberrypi-bin / libraspberrypi0 do not exist in the
# trixie suite of archive.raspberrypi.com (checked arm64 and armhf). Pointing this
# at trixie would mirror nothing.
URL="http://archive.raspberrypi.com/debian/"
KEY="bookworm main"
RELEASE=forky
TARGET=utils
METHOD=aptly
INSTALL=libraspberrypi-bin
GLOB="Name (% libraspberrypi-bin*) | Name (% libraspberrypi0*)"
ARCH=arm64:armhf
REPOSITORY=BS
